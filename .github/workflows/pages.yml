name: Publicar no GitHub Pages

# Publica o conteudo de src/ como site estatico. O SyncLab roda inteiro no
# navegador, entao nao ha nada para construir: o site e a propria pasta src/.
#
# Diferente da previa em Artifact, aqui nao ha politica bloqueando chamadas de
# rede -- as secoes de ElevenLabs e S3 funcionam normalmente.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez, sem cancelar a que ja esta em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # So o branch padrao vira site. Comparar com default_branch em vez de
    # fixar um nome mantem isto valido se o branch for renomeado ou trocado.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nao publicar uma versao quebrada: a suite roda sem dependencias.
      - name: Conferir a logica pura
        run: node testes/executar.mjs

      - name: Preparar o site
        run: |
          mkdir -p site
          cp -R src/. site/
          # Copia extra, num arquivo unico, para quem quiser levar offline.
          node ferramentas/empacotar.mjs site/synclab-arquivo-unico.html

      # O token do Actions consegue publicar no Pages, mas nao consegue criar
      # o site na primeira vez ("Resource not accessible by integration").
      # Esse passo e uma vez so, no navegador. Sem esta checagem, a falha
      # apareceria como um erro de API sem pista do que fazer.
      - name: Conferir se o Pages esta ligado
        run: |
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$codigo" = "404" ]; then
            echo "::error title=Ligue o GitHub Pages uma vez::Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
            echo ""
            echo "O GitHub Pages ainda nao foi ligado neste repositorio."
            echo "Para ligar, uma unica vez:"
            echo ""
            echo "  1. https://github.com/${{ github.repository }}/settings/pages"
            echo "  2. Em 'Build and deployment', no campo 'Source',"
            echo "     escolha 'GitHub Actions'."
            echo ""
            echo "Depois disso, este workflow publica sozinho a cada push."
            echo "Para publicar agora, sem esperar um novo push: aba Actions ->"
            echo "'Publicar no GitHub Pages' -> 'Run workflow'."
            exit 1
          fi

          echo "Pages ligado (HTTP $codigo). Seguindo para a publicacao."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicacao
        uses: actions/deploy-pages@v4
